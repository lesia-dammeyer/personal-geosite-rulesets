name: Build Custom Rulesets

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    # CRITICAL FIX: The default GITHUB_TOKEN is read-only. 
    # You need write permissions to publish a release.
    permissions:
      contents: write 
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5 # Updated to v5 to avoid Node.js deprecation warnings
        with:
          go-version: '1.24'

      - name: Setup Sing-box
        # FIX: Replaced fragile 'grep/cut' with a robust 'jq' command to parse JSON
        run: |
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r '.assets[] | select(.name | test("linux-amd64.tar.gz$")) | .browser_download_url' | head -n 1)
          wget -qO sing-box.tar.gz "$DOWNLOAD_URL"
          tar -xzf sing-box.tar.gz
          sudo mv sing-box-*/sing-box /usr/local/bin/

      - name: Setup v2dat
        run: go install github.com/urlesistiana/v2dat@latest

      - name: Checkout v2fly/domain-list-community
        uses: actions/checkout@v4
        with:
          repository: v2fly/domain-list-community
          path: domain-list-community

      - name: Inject Custom Bundle Lists
        run: |
          cat <<EOF > domain-list-community/data/my-direct
          include:apple-update
          include:microsoft
          include:icloud
          include:speedtest
          include:youtube
          include:twitch
          include:vimeo
          include:category-games
          include:google-play
          include:category-web-archive
          include:onedrive
          include:dropbox
          include:mega
          include:github
          include:docker
          include:gitlab
          EOF
          
          cat <<EOF > domain-list-community/data/my-warp
          include:falungong
          include:category-porn
          EOF

      - name: Build geosite.dat (For Shadowrocket)
        run: |
          cd domain-list-community
          go run main.go --exportlists=my-direct,my-warp
          mv dlc.dat ../geosite.dat
          cd ..

      - name: Generate sing-box Rule-sets (.srs)
        run: |
          mkdir -p ./out

          ~/go/bin/v2dat unpack geosite \
            -d ./out \
            -f my-direct \
            -f my-warp \
            geosite.dat

          ls -lah ./out

          python3 - <<'PY'
          import json
          from pathlib import Path

          mappings = {
              "my-direct": "out/geosite_my-direct.txt",
              "my-warp": "out/geosite_my-warp.txt",
          }

          for name, src in mappings.items():
              src_path = Path(src)
              if not src_path.exists():
                  raise FileNotFoundError(f"Expected unpacked file not found: {src}")

              lines = src_path.read_text().splitlines()

              rules = {
                  "domain": [],
                  "domain_suffix": [],
                  "domain_keyword": [],
                  "domain_regex": [],
              }

              for line in lines:
                  line = line.strip()
                  if not line:
                      continue

                  if line.startswith("full:"):
                      rules["domain"].append(line[5:])
                  elif line.startswith("keyword:"):
                      rules["domain_keyword"].append(line[8:])
                  elif line.startswith("regexp:"):
                      rules["domain_regex"].append(line[7:])
                  else:
                      rules["domain_suffix"].append(line)

              rules = {k: v for k, v in rules.items() if v}

              Path(f"{name}.json").write_text(
                  json.dumps({"version": 1, "rules": [rules]}, ensure_ascii=False)
              )
          PY

          sing-box rule-set compile my-direct.json -o my-direct.srs
          sing-box rule-set compile my-warp.json -o my-warp.srs

      - name: Publish Release
        uses: softprops/action-gh-release@v2 # Updated to v2
        with:
          tag_name: latest
          files: |
            geosite.dat
            my-direct.srs
            my-warp.srs
